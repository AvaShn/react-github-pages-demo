name: React Build and Deploy

on:
  push:
    branch:
      -main

permissions:
  content:
    -main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actoins/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm Install


    - name: Build React
      run: npm run build


    - name: Deploy to web-app branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: web-app